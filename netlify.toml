# Netlify: 프론트(client) + /api → Render Express 프록시
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # 빌드 시에도 Render API를 쓰려면 아래를 Netlify UI에서 같은 값으로 넣어도 됨
  # VITE_API_BASE = "https://khayah-s8iw.onrender.com/api"

# --- API 프록시 (SPA /* 보다 위에 있어야 함) ---
[[redirects]]
  from = "/api/*"
  to = "https://khayah-s8iw.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/favicon.ico"
  to = "/images/logo/khayah_logo.png"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
