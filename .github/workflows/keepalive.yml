# Render Free sleep(~15분) + Supabase Free pause(~7일) 방지
# API 배포 URL을 GitHub Secrets KEEP_ALIVE_URL 에 넣으세요.
# 예: https://khayah-api-xxxx.onrender.com/health/db

name: Keepalive

on:
  schedule:
    # 매 10분 (UTC) — Render Free 15분 sleep 대비
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API (Render + Supabase)
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          if [ -z "$KEEP_ALIVE_URL" ]; then
            echo "KEEP_ALIVE_URL secret is not set. Skip."
            exit 0
          fi
          curl -fsS --max-time 60 "$KEEP_ALIVE_URL"
          echo
          echo "OK $(date -u +%Y-%m-%dT%H:%M:%SZ)"
